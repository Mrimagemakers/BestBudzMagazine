name: Deploy Best Budz World
on:
  push:
    branches: [main, feat/best-budz-world]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check app.js && node --check player-auth.js && node --check world.js && node --check model-assets.js && node --check characters.js && node --check homes.js && node --check ultra.js && node --check xr-controls.js && node --check server/server.js
  deploy:
    # Pages' github-pages environment currently only approves feat/best-budz-world;
    # main also deploys once it is added under Settings → Environments → github-pages.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/best-budz-world'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public files only
        run: |
          mkdir _site
          cp index.html credits.html style.css app.js player-auth.js world.js model-assets.js characters.js logic.js homes.js ultra.js xr-controls.js config.json _site/
          cp -r assets _site/
          mkdir -p _site/assets/models
          unzip -jo BestBudz_Converted_Models_Stage1.zip distressed_house.glb vela_architecture.glb -d _site/assets/models
          test -s _site/assets/models/distressed_house.glb
          test -s _site/assets/models/vela_architecture.glb
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
